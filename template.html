<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Blogs — Latest</title>
<style>
  :root{
    --bg:#17151f; --panel:#1d1a28; --card:#201d2c; --card-h:#251f34;
    --line:#332c46; --line-soft:#28223a;
    --tx:#ece8f5; --tx2:#a89fc0; --tx3:#746d8c;
    --acc:#c9a8f0; --acc-bg:rgba(201,168,240,.14);
    --warn:#dba05c; --warn-tx:#3a2410;
    --r:14px;
  }
  @media (prefers-color-scheme:light){
    :root{
      --bg:#faf8fc; --panel:#fff; --card:#fff; --card-h:#f7f3fb;
      --line:#e6e0f0; --line-soft:#eee9f6;
      --tx:#211d2c; --tx2:#635c78; --tx3:#8f88a3;
      --acc:#7c5cc9; --acc-bg:rgba(124,92,201,.08);
      --warn:#c9803a; --warn-tx:#fff;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:940px;margin:0 auto;padding:36px 20px 90px}

  h1{font-size:24px;font-weight:660;margin:0 0 5px;letter-spacing:-.02em}
  .sub{color:var(--tx2);font-size:13.5px}
  .meta{color:var(--tx3);font-size:12px;margin-top:3px}

  .bar{position:sticky;top:0;z-index:20;background:var(--bg);
    padding:18px 0 12px;margin-top:22px;border-bottom:1px solid var(--line-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--tx2);
    padding:5px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;user-select:none;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    transition:border-color .14s,color .14s,background .14s}
  .chip .dot{width:7px;height:7px;border-radius:50%;flex:none;opacity:.45;transition:opacity .14s}
  .chip.on{color:var(--tx);border-color:var(--line);background:var(--card)}
  .chip.on .dot{opacity:1}
  .chip:hover{color:var(--tx)}
  .chip .n{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
  .chip .warn{display:inline-flex;align-items:center;justify-content:center;
    width:13px;height:13px;border-radius:50%;background:var(--warn);color:var(--warn-tx);
    font-size:9.5px;font-weight:700;cursor:help}
  .row2{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  input.q{flex:1;min-width:190px;background:var(--panel);border:1px solid var(--line);
    color:var(--tx);padding:9px 13px;border-radius:9px;font-size:13.5px;outline:none;font-family:inherit}
  input.q:focus{border-color:var(--acc)}
  input.q::placeholder{color:var(--tx3)}
  .mini{background:none;border:1px solid transparent;color:var(--tx3);font-size:12.5px;
    cursor:pointer;padding:8px 10px;border-radius:8px;font-family:inherit;white-space:nowrap}
  .mini:hover{color:var(--tx);border-color:var(--line)}
  .mini.on{color:var(--tx);border-color:var(--acc);background:var(--acc-bg)}
  .mini.sync-on{color:var(--acc)}
  .mini.sync-err{color:var(--warn)}

  .count{font-size:12px;color:var(--tx3);margin:16px 0 12px;font-variant-numeric:tabular-nums}

  .mo{font-size:11.5px;font-weight:640;letter-spacing:.09em;text-transform:uppercase;
    color:var(--tx3);margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line-soft)}
  .mo:first-of-type{margin-top:4px}

  .feed{display:flex;flex-direction:column;gap:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:15px 17px;display:block;transition:border-color .14s,background .14s}
  .card:hover{border-color:var(--acc);background:var(--card-h)}
  .ct{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:11.5px}
  .src{display:inline-flex;align-items:center;gap:6px;font-weight:600;letter-spacing:.015em;color:var(--tx2)}
  .src .dot{width:8px;height:8px;border-radius:50%}
  .dt{color:var(--tx3);font-variant-numeric:tabular-nums}
  .dt::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;
    background:var(--tx3);opacity:.5;vertical-align:middle;margin-right:9px}
  .card h3{margin:0 0 5px;font-size:15.5px;font-weight:600;line-height:1.4;letter-spacing:-.005em}
  .card p{margin:0;font-size:13px;color:var(--tx2);line-height:1.55}
  mark{background:var(--acc-bg);color:var(--tx);border-radius:3px;padding:0 2px}

  .card .ext{color:var(--tx3);font-size:11px;margin-left:4px}
  .card.read{opacity:.5}
  .card.read:hover{opacity:.85}
  .card-foot{display:flex;justify-content:flex-end;margin-top:11px}
  .mark-read-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
    padding:8px 15px;border-radius:999px;border:1px solid var(--line);color:var(--tx2);
    cursor:pointer;user-select:none;white-space:nowrap;
    transition:border-color .14s,color .14s,background .14s}
  .mark-read-btn:hover{border-color:var(--acc);color:var(--tx)}
  .mark-read-btn.is-read{border-color:var(--line-soft);color:var(--acc);background:var(--acc-bg)}

  .reader{position:fixed;inset:0;z-index:100;display:none}
  .reader.open{display:block}
  .reader-backdrop{position:absolute;inset:0;background:rgba(10,8,15,.65)}
  @media (prefers-color-scheme:light){.reader-backdrop{background:rgba(30,22,40,.35)}}
  .reader-panel{position:relative;margin:0 auto;max-width:720px;height:100%;
    background:var(--panel);display:flex;flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,.35)}
  @media (min-width:840px){.reader-panel{margin:22px auto;height:calc(100% - 44px);
    border-radius:16px;border:1px solid var(--line);overflow:hidden}}
  .reader-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 20px;flex:none}
  .reader-meta{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--tx2)}
  .reader-meta .src{display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .reader-meta .src .dot{width:8px;height:8px;border-radius:50%}
  .reader-actions{display:flex;align-items:center;gap:4px}
  .reader-progress{height:2px;background:var(--line-soft);flex:none}
  .reader-progress-fill{height:100%;width:0%;background:var(--acc);transform-origin:left}
  .reader-scroll{overflow-y:auto;padding:8px 28px 60px;scrollbar-width:none}
  .reader-scroll::-webkit-scrollbar{display:none}
  .reader-scroll h1{font-size:22px;line-height:1.35;font-weight:660;letter-spacing:-.01em;
    margin:14px 0 18px;max-width:640px}
  .reader-body{font-size:16.5px;line-height:1.75;color:var(--tx);max-width:640px}
  .reader-body p{margin:0 0 18px}
  .reader-body h2,.reader-body h3,.reader-body h4{margin:30px 0 12px;font-weight:660;letter-spacing:-.01em}
  .reader-body h2{font-size:19px}.reader-body h3{font-size:17px}.reader-body h4{font-size:16px}
  .reader-body a{color:var(--acc);text-decoration:underline;text-underline-offset:2px}
  .reader-body ul,.reader-body ol{margin:0 0 18px;padding-left:22px}
  .reader-body li{margin:6px 0}
  .reader-body blockquote{margin:0 0 18px;padding:2px 0 2px 16px;border-left:2px solid var(--line);
    color:var(--tx2)}
  .reader-body pre{margin:0 0 18px;padding:14px 16px;background:var(--card);border:1px solid var(--line);
    border-radius:9px;overflow-x:auto;font-size:13px;line-height:1.55}
  .reader-body code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em}
  .reader-body pre code{font-size:1em}
  .reader-body hr{border:none;border-top:1px solid var(--line-soft);margin:26px 0}

  .none{text-align:center;color:var(--tx3);font-size:13.5px;padding:50px 10px}
  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line-soft);
    font-size:11.5px;color:var(--tx3);line-height:1.7}
  footer a{color:var(--tx2);border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Engineering Blogs</h1>
  <div class="sub">Latest posts from Uber, Swiggy, AWS, Netflix, Airbnb, Stripe, Meta and Spotify.</div>
  <div class="meta" id="genline"></div>

  <div class="bar">
    <div class="chips" id="chips"></div>
    <div class="row2">
      <input class="q" id="q" type="text" placeholder="Search titles and summaries…" autocomplete="off">
      <button class="mini" id="all">All</button>
      <button class="mini" id="none">None</button>
      <button class="mini" id="unread-toggle" title="Show only posts you haven't marked read">Unread only</button>
      <button class="mini" id="sync-btn" title="Sync read state across devices via a private GitHub gist">Sync</button>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div id="feed"></div>
  <div class="none" id="none-state" style="display:none">Nothing matches those filters.</div>

  <footer>
    Snapshot of each blog's public feed. Sources:
    <span id="srclinks"></span>
  </footer>
</div>

<div class="reader" id="reader">
  <div class="reader-backdrop" id="reader-backdrop"></div>
  <div class="reader-panel">
    <div class="reader-bar">
      <div class="reader-meta">
        <span class="src" id="reader-src"></span>
        <span class="dt" id="reader-date"></span>
      </div>
      <div class="reader-actions">
        <a class="mini" id="reader-original" target="_blank" rel="noopener">Open original ↗</a>
        <button class="mini" id="reader-close" aria-label="Close reading mode">✕ Close</button>
      </div>
    </div>
    <div class="reader-progress"><div class="reader-progress-fill" id="reader-progress-fill"></div></div>
    <div class="reader-scroll" id="reader-scroll">
      <h1 id="reader-title"></h1>
      <div class="reader-body" id="reader-body"></div>
    </div>
  </div>
</div>

<script>
const DATA = __DATA__;
const SOURCES = DATA.sources;
const ITEMS = DATA.posts;
const ERRORS = DATA.errors || {};
const SMAP = Object.fromEntries(SOURCES.map(s=>[s.id,s]));
let active = new Set(SOURCES.map(s=>s.id));
let unreadOnly = false;

// Read-state: tracked locally in this browser, optionally synced across
// devices via a private GitHub gist (see initSync below). The gist is the
// only external request this page ever makes, and only once a token is
// supplied — everything else stays fully offline/self-contained.
const LS_STATE = 'ebf_read_state_v1';
const LS_SYNC = 'ebf_sync_v1';
const GIST_FILENAME = 'engineering-blogs-feed-state.json';

function loadLocalState(){
  try{ return JSON.parse(localStorage.getItem(LS_STATE)) || {read:[]}; }
  catch(_){ return {read:[]}; }
}
function saveLocalState(state){
  try{ localStorage.setItem(LS_STATE, JSON.stringify(state)); }catch(_){}
}
function loadSyncConfig(){
  try{ return JSON.parse(localStorage.getItem(LS_SYNC)); }
  catch(_){ return null; }
}
function saveSyncConfig(cfg){
  try{
    cfg ? localStorage.setItem(LS_SYNC, JSON.stringify(cfg)) : localStorage.removeItem(LS_SYNC);
  }catch(_){}
}

let readSet = new Set(loadLocalState().read || []);
let syncConfig = loadSyncConfig();

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function hl(text, q){
  const e = esc(text);
  if(!q) return e;
  try{
    const rx = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    return e.replace(rx,'<mark>$1</mark>');
  }catch(_){ return e; }
}

function fmtDate(iso){
  const d = new Date(iso+'T12:00:00Z');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
}
function monthKey(iso){
  const d = new Date(iso+'T12:00:00Z');
  return d.toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});
}

function buildChips(){
  const el = document.getElementById('chips');
  el.innerHTML='';
  SOURCES.forEach(s=>{
    const n = ITEMS.filter(i=>i.source===s.id).length;
    const c = document.createElement('div');
    c.className='chip on'; c.dataset.id=s.id;
    const warn = ERRORS[s.id] ? `<span class="warn" title="${esc(ERRORS[s.id])}">!</span>` : '';
    c.innerHTML = `<span class="dot" style="background:${s.color}"></span>${esc(s.name)}${warn}<span class="n">${n}</span>`;
    c.onclick = ()=>{
      active.has(s.id) ? active.delete(s.id) : active.add(s.id);
      c.classList.toggle('on', active.has(s.id));
      render();
    };
    el.appendChild(c);
  });
  document.getElementById('srclinks').innerHTML =
    SOURCES.map(s=>`<a href="${s.site}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(' · ');
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const feed = document.getElementById('feed');
  const list = ITEMS.filter(i => active.has(i.source) &&
    (!unreadOnly || !readSet.has(i.url)) &&
    (!q || i.title.toLowerCase().includes(q) || (i.summary||'').toLowerCase().includes(q)));

  document.getElementById('count').textContent =
    `${list.length} post${list.length===1?'':'s'} · ${active.size} of ${SOURCES.length} blogs`;
  document.getElementById('none-state').style.display = list.length ? 'none' : 'block';

  let html='', last='';
  list.forEach(i=>{
    const mk = monthKey(i.date);
    if(mk!==last){
      if(last) html += `</div>`;
      html += `<div class="mo">${mk}</div><div class="feed">`;
      last = mk;
    }
    const s = SMAP[i.source];
    const summary = i.summary ? `<p>${hl(i.summary,q)}</p>` : '';
    const ext = i.content ? '' : `<span class="ext">↗ opens original</span>`;
    const isRead = readSet.has(i.url);
    const btnLabel = isRead ? '✓ Read' : 'Mark as read';
    html += `<a class="card${isRead?' read':''}" href="${esc(i.url)}" target="_blank" rel="noopener">
      <div class="ct"><span class="src"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</span><span class="dt">${fmtDate(i.date)}</span>${ext}</div>
      <h3>${hl(i.title,q)}</h3>${summary}
      <div class="card-foot"><span class="mark-read-btn${isRead?' is-read':''}">${btnLabel}</span></div></a>`;
  });
  if(last) html += `</div>`;
  feed.innerHTML = html;
}

function markRead(url){
  if(readSet.has(url)) return;
  readSet.add(url);
  persistReadState();
  render();
}
function markUnread(url){
  if(!readSet.has(url)) return;
  readSet.delete(url);
  persistReadState();
  render();
}
let saveTimer = null;
function persistReadState(){
  const state = { read: Array.from(readSet) };
  saveLocalState(state);
  if(!syncConfig || !syncConfig.token || !syncConfig.gistId) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      setSyncStatus('syncing');
      await saveGistState(syncConfig.token, syncConfig.gistId, state);
      setSyncStatus('synced');
    }catch(err){
      setSyncStatus('error', err.message);
    }
  }, 1200);
}

// Reading mode: cards with extracted content open in-page instead of
// navigating away. Modifier-clicks and middle-clicks still behave like a
// normal link, so "open in new tab" keeps working as expected.
const reader = document.getElementById('reader');
const readerScroll = document.getElementById('reader-scroll');
const readerProgressFill = document.getElementById('reader-progress-fill');
function updateReaderProgress(){
  const max = readerScroll.scrollHeight - readerScroll.clientHeight;
  const pct = max > 0 ? Math.min(100, Math.max(0, (readerScroll.scrollTop / max) * 100)) : 100;
  readerProgressFill.style.width = pct + '%';
}
readerScroll.addEventListener('scroll', updateReaderProgress);
function openReader(post){
  const s = SMAP[post.source];
  document.getElementById('reader-src').innerHTML =
    `<span class="dot" style="background:${s.color}"></span>${esc(s.name)}`;
  document.getElementById('reader-date').textContent = fmtDate(post.date);
  document.getElementById('reader-title').textContent = post.title;
  document.getElementById('reader-body').innerHTML = post.content;
  document.getElementById('reader-original').href = post.url;
  reader.classList.add('open');
  readerScroll.scrollTop = 0;
  updateReaderProgress();
  document.body.style.overflow = 'hidden';
}
function closeReader(){
  reader.classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('feed').addEventListener('click', e=>{
  const card = e.target.closest('.card');
  if(!card) return;
  const url = card.getAttribute('href');

  const btn = e.target.closest('.mark-read-btn');
  if(btn){
    e.preventDefault();
    readSet.has(url) ? markUnread(url) : markRead(url);
    return;
  }

  markRead(url);

  if(e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const post = ITEMS.find(p => p.url === url);
  if(post && post.content){
    e.preventDefault();
    openReader(post);
  }
});
document.getElementById('feed').addEventListener('auxclick', e=>{
  if(e.button !== 1) return;
  const card = e.target.closest('.card');
  if(card) markRead(card.getAttribute('href'));
});
document.getElementById('reader-close').onclick = closeReader;
document.getElementById('reader-backdrop').onclick = closeReader;
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && reader.classList.contains('open')) closeReader();
});

document.getElementById('q').addEventListener('input', render);
document.getElementById('all').onclick = ()=>{ active=new Set(SOURCES.map(s=>s.id));
  document.querySelectorAll('.chip').forEach(c=>c.classList.add('on')); render(); };
document.getElementById('none').onclick = ()=>{ active=new Set();
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); render(); };
document.getElementById('unread-toggle').onclick = e=>{
  unreadOnly = !unreadOnly;
  e.target.classList.toggle('on', unreadOnly);
  render();
};

// Optional cross-device sync: read state lives in a private GitHub gist,
// found or created by filename so a second device only needs the same
// token pasted in — no gist ID to copy around. Entirely opt-in; with no
// token this page never makes an external request.
const syncBtn = document.getElementById('sync-btn');
function setSyncStatus(status, detail){
  const labels = {off:'Sync', syncing:'Syncing…', synced:'Synced ✓', error:'Sync error ⚠'};
  syncBtn.textContent = labels[status] || 'Sync';
  syncBtn.classList.toggle('sync-on', status === 'synced');
  syncBtn.classList.toggle('sync-err', status === 'error');
  syncBtn.title = status === 'error' && detail
    ? `Sync error: ${detail}`
    : 'Sync read state across devices via a private GitHub gist';
}
async function ghFetch(url, token, opts){
  const res = await fetch(url, {...opts, headers:{
    Authorization: `Bearer ${token}`,
    Accept: 'application/vnd.github+json',
    ...(opts && opts.headers),
  }});
  if(!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}
async function findOrCreateGist(token){
  for(let page = 1; page <= 5; page++){
    const gists = await ghFetch(`https://api.github.com/gists?per_page=100&page=${page}`, token);
    const found = gists.find(g => g.files && g.files[GIST_FILENAME]);
    if(found) return found.id;
    if(gists.length < 100) break;
  }
  const created = await ghFetch('https://api.github.com/gists', token, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      description: 'Engineering Blogs Feed — read state (personal sync, do not edit manually)',
      public: false,
      files: { [GIST_FILENAME]: { content: JSON.stringify({read:[]}) } },
    }),
  });
  return created.id;
}
async function fetchGistState(token, gistId){
  const gist = await ghFetch(`https://api.github.com/gists/${gistId}`, token);
  const file = gist.files[GIST_FILENAME];
  if(!file) throw new Error('gist missing state file');
  return JSON.parse(file.content);
}
async function saveGistState(token, gistId, state){
  await ghFetch(`https://api.github.com/gists/${gistId}`, token, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(state) } } }),
  });
}
async function initSync(){
  if(!syncConfig || !syncConfig.token){ setSyncStatus('off'); return; }
  setSyncStatus('syncing');
  try{
    if(!syncConfig.gistId){
      syncConfig.gistId = await findOrCreateGist(syncConfig.token);
      saveSyncConfig(syncConfig);
    }
    const remote = await fetchGistState(syncConfig.token, syncConfig.gistId);
    const merged = { read: Array.from(new Set([...(remote.read||[]), ...readSet])) };
    readSet = new Set(merged.read);
    saveLocalState(merged);
    render();
    await saveGistState(syncConfig.token, syncConfig.gistId, merged);
    setSyncStatus('synced');
  }catch(err){
    setSyncStatus('error', err.message);
  }
}
syncBtn.onclick = async ()=>{
  if(syncConfig && syncConfig.token){
    if(confirm('Disconnect GitHub sync on this device? Your read state stays saved in the gist and locally here — this only stops syncing.')){
      syncConfig = null;
      saveSyncConfig(null);
      setSyncStatus('off');
    }
    return;
  }
  const token = prompt(
    'Paste a GitHub personal access token with only the "gist" scope.\n' +
    'Create one at github.com/settings/tokens (classic) → check just "gist".\n\n' +
    "It's stored only in this browser's localStorage and only ever talks to api.github.com."
  );
  if(!token) return;
  syncConfig = { token: token.trim(), gistId: null };
  saveSyncConfig(syncConfig);
  await initSync();
};
setSyncStatus(syncConfig && syncConfig.token ? 'syncing' : 'off');
if(syncConfig && syncConfig.token) initSync();

// Rendered client-side so the timestamp shows in the reader's own timezone.
(function(){
  const d = new Date(DATA.generated_at);
  const when = isNaN(d) ? DATA.generated_at
    : d.toLocaleString(undefined,{day:'numeric',month:'short',year:'numeric',
                                  hour:'2-digit',minute:'2-digit'});
  const nerr = Object.keys(ERRORS).length;
  document.getElementById('genline').textContent =
    `Updated ${when}` + (nerr ? ` · ${nerr} source${nerr===1?'':'s'} failed to refresh` : '');
})();

buildChips();
render();
</script>
</body>
</html>
