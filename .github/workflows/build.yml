name: Build and deploy feed

on:
  # Rebuild every day at 06:00 UTC (11:30 AM IST).
  schedule:
    - cron: "0 6 * * *"
  # Rebuild on every push to main.
  push:
    branches: [main]
  # Allow rebuilding by hand from the Actions tab.
  workflow_dispatch:

# Required for the deploy-to-Pages step.
permissions:
  contents: write
  pages: write
  id-token: write

# Never let two deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch feeds and render site
        run: python build.py

      - name: Commit refreshed post data
        # Keeps data/posts.json in the repo so a later failed fetch has
        # something to fall back on. Skips cleanly when nothing changed.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json index.html
          git diff --staged --quiet || git commit -m "chore: refresh feed data [skip ci]"
          git push || (git pull --rebase && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
