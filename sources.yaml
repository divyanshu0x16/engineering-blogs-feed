# Engineering blog sources.
#
# Add a new blog by appending an entry here — nothing else needs to change.
#
#   id:     short slug, used internally (lowercase, no spaces)
#   name:   display name shown on the chip and card
#   color:  accent dot colour (hex) — pick a soft/pastel tone that reads
#           against the dark theme, not the blog's literal (often
#           saturated) brand color: OKLCH lightness ~0.58-0.67, chroma
#           ~0.10-0.15. If adding several sources at once, validate
#           distinguishability with the dataviz skill's palette script.
#   site:   human-facing blog homepage, linked in the footer
#   type:   "rss"    -> parse `feed` with feedparser (the normal case)
#           "scrape" -> no usable feed exists; use a custom scraper in
#                       scripts/scrapers.py registered under this id
#   feed:   feed URL (required when type is rss)
#
# Tip: to find a blog's feed, view source on its homepage and look for
#   <link rel="alternate" type="application/rss+xml" href="...">
# Common paths worth trying: /feed, /rss, /feed.xml, /rss.xml, /atom.xml
# Medium publications: https://medium.com/feed/<publication-name>

sources:
  - id: uber
    name: Uber
    color: "#6A93D5"
    site: https://www.uber.com/blog/engineering/
    type: scrape          # Uber has no public RSS feed; see scrapers.py

  - id: swiggy
    name: Swiggy
    color: "#D17D3E"
    site: https://bytes.swiggy.com/
    type: rss
    feed: https://swiggybytes.medium.com/feed
    # NOTE: this publication has been dormant since mid-2024 and skews
    # toward career profiles rather than engineering. Candidate for removal.

  - id: aws
    name: AWS
    color: "#00AD8F"
    site: https://aws.amazon.com/blogs/architecture/
    type: rss
    feed: https://aws.amazon.com/blogs/architecture/feed/

  - id: netflix
    name: Netflix
    color: "#C08800"
    site: https://netflixtechblog.com/
    type: rss
    feed: https://netflixtechblog.com/feed

  - id: airbnb
    name: Airbnb
    color: "#C56F99"
    site: https://medium.com/airbnb-engineering
    type: rss
    feed: https://medium.com/feed/airbnb-engineering

  - id: stripe
    name: Stripe
    color: "#38A065"
    site: https://stripe.com/blog
    type: rss
    feed: https://stripe.com/blog/feed.rss
    # NOTE: Stripe publishes no engineering-only feed, so this mixes in
    # product and business posts. Consider filtering by keyword.

  - id: meta
    name: Meta
    color: "#9577C7"
    site: https://engineering.fb.com/
    type: rss
    feed: https://engineering.fb.com/feed/

  - id: spotify
    name: Spotify
    color: "#CC6660"
    site: https://engineering.atspotify.com/
    type: rss
    feed: https://engineering.atspotify.com/feed/

